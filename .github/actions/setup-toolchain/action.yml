name: Setup Node and pnpm
description: Install Node and pnpm, then install dependencies, from the root package.json

runs:
  using: composite
  steps:
    # Unified setup: reads the Node version from `devEngines.runtime` in
    # package.json and the pnpm version from `packageManager`, then runs
    # `pnpm install` (the action's default). No separate setup-node or install
    # step is needed. `--no-runtime` is appended automatically because a
    # runtime is set, so the Node managed here is never shadowed.
    - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      with:
        runtime: node
        cache: true
