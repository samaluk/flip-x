name: Setup Node and pnpm
description: Install Node and pnpm, then install dependencies, from the root package.json

runs:
  using: composite
  steps:
    # Unified setup: reads the Node version from `devEngines.runtime` in
    # package.json and the pnpm version from `packageManager`. Keep dependency
    # installation explicit below so pnpm refreshes the workspace validation
    # state used by `verifyDepsBeforeRun` before later `pnpm run`/`pnpm exec`
    # steps.
    # Renovate keeps `engines.node` and `devEngines.runtime.version` aligned.
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node
        cache: true
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
