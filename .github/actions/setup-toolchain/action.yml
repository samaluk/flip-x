name: Setup Node and pnpm
description: Install Node and pnpm versions from the root package.json

runs:
  using: composite
  steps:
    # Node must be installed before pnpm 11.x (requires Node >=22.13).
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json

    - uses: pnpm/setup@v2.0.2
      with:
        cache: true
        install: false
