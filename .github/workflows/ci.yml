name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static quality checks and the runtime-facing suites run as parallel jobs.
  # Each job is its own required status check on the master-branch ruleset, so
  # every one must pass for a merge. setup-toolchain installs Node, pnpm, and
  # dependencies, so checkout + setup is all each job needs. The Fallow gates
  # (including the coverage-producing Vitest run they consume) live in their
  # own workflow: .github/workflows/fallow.yml.
  static:
    name: Lint, typecheck, format, i18n & design
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Lint DESIGN.md
        run: pnpm design:lint

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Check i18n
        run: pnpm i18n:check

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      # Next 16.3 enables turbopackFileSystemCacheForBuild by default; Turbopack
      # writes to .next/cache/turbopack. Cache the whole .next/cache tree.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx,mjs,cjs}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Since the root layout migrated to static per-locale rendering, `pnpm build`
      # now prerenders /en and /es, which evaluates the module-scope Convex client.
      # The construction only rejects a missing/non-absolute URL; a placeholder passes
      # and never connects at build time. CI's output is discarded (Vercel rebuilds with
      # the real URL), so this keeps the build green without baking a real URL in.
      - name: Build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
        run: pnpm build

  vrt:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Visual regression (Vitest browser, Linux Docker)
        env:
          SKIP_VRT_DOCKER_INSTALL: "1"
        run: pnpm test:vrt

  # Backend smoke and E2E share one Convex preview deployment (created/deleted
  # per run by scripts/convex-preview-test.sh), so they must stay in one job.
  convex:
    name: Backend & E2E (Convex preview)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_TEAM_ACCESS_TOKEN: ${{ secrets.CONVEX_TEAM_ACCESS_TOKEN }}
      CONVEX_TEAM_SLUG: ${{ vars.CONVEX_TEAM_SLUG }}
      # Optional: real phc_… token for preview deploys (matches prod). Deploy succeeds without it.
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_FLAGS_POLLING_INTERVAL_SECONDS: "300"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Resolve Convex preview deployment name
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "PREVIEW_DEPLOYMENT_NAME=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
            echo "GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            echo "PREVIEW_DEPLOYMENT_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run backend tests (Convex preview)
        run: pnpm test:backend

      - name: Run E2E (Convex preview)
        run: pnpm test:e2e
