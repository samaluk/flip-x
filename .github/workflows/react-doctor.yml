name: React Doctor

# Dedicated strict React Doctor v2 gate. This replaces the old CLI-inside-general-CI
# setup (which ran `react-doctor --diff ... --fail-on warning --annotations` as a
# sub-step of the `static` job) with the official `millionco/react-doctor` Action:
#   - PRs: scans only the code changed relative to the merge base (`scope: changed`)
#     and blocks the workflow on ANY new warning or error (`blocking: warning`),
#     posting a sticky PR summary comment, inline review comments, and a commit status.
#   - master (default branch): posts a commit status on each push, so branch health
#     stays visible alongside the PR gate.
# The Action checks out the repo itself. The only extra setup is the shared
# toolchain bootstrap, which lets the workflow read the pinned react-doctor CLI
# version from node_modules and pass it as `version:` - so every scan runs the
# exact same CLI the local hk gates run, and Renovate bumps propagate here
# automatically through the dependency manifest alone.
# The React project lives at the repo root, so no `directory` override is needed.
# The workflow-level token stays read-only; write scopes for review comments, the
# PR comment, and the commit status are granted to the single job that needs them.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master

permissions:
  contents: read # workflow-level token stays read-only; the job below elevates

# Cancel any in-flight scan for the same PR (or branch, on push) the moment a new
# commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    permissions:
      contents: read # checkout and read code (required)
      pull-requests: write # inline review comments
      issues: write # sticky PR summary comment
      statuses: write # commit status (score + error/warning counts)
    # Fork PRs always run hosted so untrusted code never touches self-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Action diffs the PR against its merge base to find introduced
          # issues, so it needs the full history to locate where the branch split.
          fetch-depth: 0
          persist-credentials: false
          # Self-hosted runners keep their workspace between jobs; skip the slow
          # git-clean there and let the runner manage workspace reuse instead.
          clean: ${{ vars.USE_SELF_HOSTED_RUNNERS != 'true' }}

      # Installs dependencies so the version probe below can resolve the pinned
      # react-doctor package from node_modules.
      - uses: ./.github/actions/setup-toolchain

      - name: Resolve react-doctor CLI version
        id: rdver
        run: echo "version=$(node -p "require('react-doctor/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Scan changed code for new findings
        # Immutable pin for the current v2 release (v2.2.8 is what the `v2` tag
        # points to). The Action uses the installed project config at the root.
        uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          # Fail the check on any new error OR warning introduced by the change.
          blocking: warning
          # Report only issues introduced relative to the merge base (PR-scoped).
          scope: changed
          # Scan with the exact react-doctor CLI pinned by package.json, not the
          # Action's own bundled copy, so CI agrees with the local hk gates.
          version: ${{ steps.rdver.outputs.version }}
          comment: true
          review-comments: true
          commit-status: true
