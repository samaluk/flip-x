name: Cleanup Convex preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && (vars.SELF_HOSTED_RUNNER_LABELS != '' && fromJSON(vars.SELF_HOSTED_RUNNER_LABELS) || fromJSON('["self-hosted"]')) || 'ubuntu-latest') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Plain Node only — delete-convex-preview.mjs has no pnpm deps. setup-toolchain
      # enables pnpm cache on GitHub-hosted runners, which fails post-job without install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Delete Convex preview for closed PR
        env:
          CONVEX_TEAM_ACCESS_TOKEN: ${{ secrets.CONVEX_TEAM_ACCESS_TOKEN }}
          CONVEX_TEAM_SLUG: ${{ vars.CONVEX_TEAM_SLUG }}
          PREVIEW_DEPLOYMENT_NAME: pr-${{ github.event.pull_request.number }}
        run: node scripts/delete-convex-preview.mjs
