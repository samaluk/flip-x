name: Fallow

# Dedicated Fallow workflow: the full-repository quality gate plus the PR
# review surface, with the coverage evidence they consume produced inside the
# same workflow. Job names ("Test with coverage", "Fallow gate", "Fallow PR
# review") are the required status checks on the master-branch ruleset and are
# kept stable across the move out of ci.yml.

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs the fast Vitest suites (engine, infrastructure, contract, ui, confect)
  # once with coverage and shares coverage-final.json with both Fallow jobs, so
  # they do not reinstall and re-run the suite just to score the same evidence.
  test:
    name: Test with coverage
    # Fork-safe runner selection, matching the other quality workflows.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  # Authoritative strict Fallow gate: changed-file audit plus the full-repository
  # dead-code, duplication, and health checks via pnpm fallow:full. The review
  # job owns PR feedback.
  gate:
    name: Fallow gate
    needs: test
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      # Same coverage evidence the test job produced, so audit and health CRAP scoring
      # matches — downloaded rather than regenerated to avoid a second
      # install + test run.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Fallow CI gate
        run: pnpm fallow:full
        env:
          FALLOW_AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/master' }}

  # One immutable Fallow Action analysis. It renders the compact sticky
  # summary, Check Run, inline review comments, and review guidance directly.
  # This job is a required check (fail-on-issues is on), so Fallow findings block
  # the merge; the gate job owns the strict project-wide gates.
  review:
    name: Fallow PR review
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      # Fallow installs its CLI globally with npm. The runtime managed by
      # pnpm/setup can use a different npm prefix, so expose that bin directory.
      - name: Expose npm global binaries
        run: echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      # Same coverage evidence the test job produced, so audit CRAP scoring
      # matches — downloaded rather than regenerated to avoid a second
      # install + test run.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Fallow changed-code audit
        uses: fallow-rs/fallow@94d5f7ad28fd921c6709bf4939c2d5fe0b76a273 # v3.19.0
        with:
          command: audit
          gate: all
          type-aware: true
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          comment: true
          comment-layout: compact
          branded-token: false
          review-comments: true
          review-guidance: true
