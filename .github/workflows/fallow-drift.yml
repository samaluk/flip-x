name: Fallow (drift scan)

# Full-project Fallow scan that runs exactly once per resolved fallow CLI
# version instead of on a cron. Exactly-once semantics come from the cache key
# being the resolved version (`fallow-drift-<version>`): a version that has
# already been scanned restores a cache hit and skips both the marker and the
# scan, while dependency bumps that don't touch fallow only cost a no-op run.
# A failed scan is never cached - actions/cache only saves entries when the job
# succeeds - so an unscanned version is always retried on the next triggering
# push.
# On a cache miss, the workflow installs the lockfile dependency graph,
# generates fresh coverage, and runs the same explicit full gate as normal CI
# and pre-push. This keeps version drift focused on whether that canonical gate
# still passes with the newly resolved Fallow version.

on:
  push:
    branches: [master]
    paths: ["**/package.json", "**/pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallow-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-scan:
    permissions:
      contents: read
    # Fork-safe runner selection, matching the other quality workflows.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The two-space indent anchors the lockfile's package key (and avoids
      # matching lookalikes such as fallow-type-aware); this repo's lockfile
      # carries no tarball URLs, so the family's leading-slash grep would never
      # match here.
      - id: fver
        run: |
          v="$(grep -m1 -oE '^  fallow@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | cut -d@ -f2-)"
          if [ -z "$v" ]; then echo "::error::fallow version not found in pnpm-lock.yaml"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - id: seen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fallow-drift
          key: fallow-drift-${{ steps.fver.outputs.version }}

      - name: Mark this version as scanned
        if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .fallow-drift && date > ".fallow-drift/${{ steps.fver.outputs.version }}"

      - name: Setup Node and pnpm
        if: steps.seen.outputs.cache-hit != 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node
          cache: true
          install: false

      - name: Install dependencies
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify Fallow version
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          actual="$(pnpm exec fallow --version | sed -n '1s/^fallow //p')"
          expected="${{ steps.fver.outputs.version }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::installed fallow version $actual does not match lockfile version $expected"
            exit 1
          fi

      - name: Generate coverage
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm test:coverage

      - name: Verify coverage artifact
        if: steps.seen.outputs.cache-hit != 'true'
        run: test -s coverage/coverage-final.json

      - name: Fallow (full drift scan)
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm fallow:full
