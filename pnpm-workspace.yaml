# Fail fast in hooks: `pnpm run`/`pnpm exec` (every hk step via `pnpm exec`/`pnpm run`)
# must not auto-install or prompt. Surface a clear VERIFY_DEPS_BEFORE_RUN error instead
# of ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY in non-TTY agent shells. Recovery is
# an explicit `pnpm install` (or `CI=1 pnpm install` when stdin is not a TTY and the
# store/layout is incompatible and needs a purge).
verifyDepsBeforeRun: error
allowBuilds:
  "@parcel/watcher": true
  "@posthog/cli": true
  "@swc/core": true
  core-js: true
  esbuild: true
  fallow: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: false
  unrs-resolver: false
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# semver@6.3.1 is the standard CVE-2022-25883 backport (published 2023 without
# provenance, unlike 6.3.0); the no-downgrade policy reads that age gap as a
# possible takeover, so pin the exception to the exact vetted version.
# why-is-node-running@3.2.2 is the Vitest 5.0.2 transitive requirement
# (vitest declares ^3.2.1): legitimate maintainer handoff from mafintosh to
# veteran account jkoops (member since 2010), who modernized the package
# (ESM, zero deps, provenance on 3.2.x) across PRs #66-#83 with 75M+ weekly
# downloads. The no-downgrade policy reads the publisher change as a possible
# takeover, so pin the exception to the exact vetted version.
trustPolicyExclude:
  - "semver@6.3.1"
  - "why-is-node-running@3.2.2"
