[tools]
# Node version is single-sourced in package.json (`engines.node` +
# `devEngines.runtime.version`); do not pin node here to avoid a third source.
hk = "1.57.0"
"github:mongodb/kingfisher" = "2.1.0"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[tasks.pre-commit]
description = "Run the same checks as the pre-commit hook"
run = "hk run pre-commit"

[tasks.pre-push]
description = "Run the same checks as the pre-push hook"
run = "hk run pre-push"
